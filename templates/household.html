{% extends "base.html" %}
{% block content %}
<div class="auth-page">
  <div class="auth-card wide">
    <div class="auth-header">
      <span class="auth-logo">🏡</span>
      <h1>Set up your home</h1>
      <p>Create a household or join one with a code</p>
    </div>
    <div class="household-options">
      <div class="household-option">
        <h2>🌾 Create</h2>
        <p>Start fresh and share the code with housemates</p>
        <form method="POST">
          <input type="hidden" name="action" value="create">
          <div class="form-group">
            <label>Household name</label>
            <input type="text" name="household_name" placeholder="e.g. Our Apartment" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full">▶ Create & get code</button>
        </form>
      </div>
      <div class="household-divider">— or —</div>
      <div class="household-option">
        <h2>🤝 Join</h2>
        <p>Enter the code your housemate gave you</p>
        <form method="POST">
          <input type="hidden" name="action" value="join">
          <div class="form-group">
            <label>Household code</label>
            <input type="text" name="household_code" placeholder="e.g. A1B2C3D4" maxlength="8" style="text-transform:uppercase" required>
          </div>
          <button type="submit" class="btn btn-gold btn-full">▶ Join household</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
