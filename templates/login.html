{% extends "base.html" %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-logo">🏠</span>
      <h1>HomePoints</h1>
      <p>Welcome back!</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required placeholder="your username" autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">▶ Log in</button>
    </form>
    <div class="auth-footer">New here? <a href="{{ url_for('register') }}">Create account</a></div>
  </div>
</div>
{% endblock %}
